<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JournalBing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: schmale Seitenleiste links mit allen Funktionen (Suche, Sammlungen, Daten), rechts eine ruhige Lesespalte. Auf schmalen Bildschirmen wird die Leiste zum ausklappbaren Menü. */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --fg: #14232b;
  --muted: #5a6b73;
  --line: #d6e0e4;
  --accent: #0b6e84;
  --accent-fg: #ffffff;
  --accent-soft: #dcedf1;
  --oa: #17784a;
  --oa-bg: #e0f3e8;
  --closed: #5a6b73;
  --closed-bg: #e8edef;
  --warn: #9a3412;
  --warn-bg: #fdeadd;
  --heart: #c0264f;
  --heart-bg: #fde4ea;
  --scrim: rgba(10, 25, 31, 0.45);
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1f;
    --surface: #17262d;
    --fg: #e3edf0;
    --muted: #93a6ae;
    --line: #2a3d46;
    --accent: #5bc0d6;
    --accent-fg: #07222a;
    --accent-soft: #1b3a44;
    --oa: #6fd39d;
    --oa-bg: #17382a;
    --closed: #93a6ae;
    --closed-bg: #22343c;
    --warn: #f4a972;
    --warn-bg: #3a2616;
    --heart: #ff8aa6;
    --heart-bg: #3b1a25;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1f;
  --surface: #17262d;
  --fg: #e3edf0;
  --muted: #93a6ae;
  --line: #2a3d46;
  --accent: #5bc0d6;
  --accent-fg: #07222a;
  --accent-soft: #1b3a44;
  --oa: #6fd39d;
  --oa-bg: #17382a;
  --closed: #93a6ae;
  --closed-bg: #22343c;
  --warn: #f4a972;
  --warn-bg: #3a2616;
  --heart: #ff8aa6;
  --heart-bg: #3b1a25;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}

h1, h2, h3 { font-family: var(--font-head); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.6rem; line-height: 1.15; }
h3 { font-size: 1.2rem; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.95rem; }

/* ---------- Gerüst ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
}
.sidebar .brand { font-size: 1.3rem; padding: 4px 12px 16px; }

.sidelabel {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 0 12px;
  margin: 18px 0 4px;
}
.navitem {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--fg);
  border: 0;
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 0.95rem;
  min-width: 0;
}
.navitem span.t { overflow-wrap: anywhere; min-width: 0; }
.navitem:hover { background: var(--accent-soft); }
.navitem.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navitem .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 400; flex: none; }
.navitem.quiet { color: var(--accent); }
.newrow { display: flex; gap: 6px; padding: 4px 4px 4px 12px; }
.newrow input { flex: 1; padding: 7px 10px; font-size: 0.9rem; min-width: 0; }
.sidehint { color: var(--muted); font-size: 0.8rem; padding: 6px 12px 0; }
.sidestatus { color: var(--muted); font-size: 0.85rem; padding: 6px 12px 0; min-height: 1.4em; }

.main {
  min-width: 0;
  padding-top: max(28px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: 32px;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.content { max-width: 760px; display: flex; flex-direction: column; gap: 20px; }
section.view { display: flex; flex-direction: column; gap: 20px; }

.topbar, .backdrop { display: none; }

@media (max-width: 860px) {
  .app { display: block; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar .brand { font-family: var(--font-head); font-weight: 700; font-size: 1.15rem; }
  .menubtn {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 42px;
    height: 42px;
    font-size: 1.2rem;
    line-height: 1;
  }
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(300px, 86vw);
    height: auto;
    z-index: 40;
    visibility: hidden;
    transform: translateX(-100%);
  }
  .sidebar.open { visibility: visible; transform: translateX(0); }
  .backdrop { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: 20px; }
}
@media (max-width: 860px) and (prefers-reduced-motion: no-preference) {
  .sidebar { transition: transform 0.2s ease, visibility 0.2s; }
}

/* ---------- Formulare ---------- */
form.search { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="search"], input[type="text"], select {
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 12px;
  min-width: 0;
}
input[type="search"] { flex: 1; font-size: 1rem; background: var(--surface); }
select { background: var(--surface); }
button { font: inherit; cursor: pointer; }
button.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  border-radius: 8px;
  padding: 11px 18px;
  font-weight: 600;
}
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.filters label { display: flex; align-items: center; gap: 6px; }
.filters select { padding: 7px 10px; font-size: 0.9rem; }
.filters input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

.examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.chip {
  background: var(--surface);
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 0.9rem;
}

.status { color: var(--muted); font-size: 0.9rem; min-height: 1.4em; }
.error { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 12px 14px; font-size: 0.95rem; }

/* ---------- Karten ---------- */
.results { display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.card h2 { font-size: 1.08rem; line-height: 1.3; font-weight: 700; overflow-wrap: anywhere; }
.card h2 a { color: inherit; text-decoration: none; }
.card h2 a:hover { text-decoration: underline; }
.authors { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
.authors b { color: var(--fg); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.meta .num { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }
.badge { border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; font-weight: 600; }
.badge.oa { background: var(--oa-bg); color: var(--oa); }
.badge.closed { background: var(--closed-bg); color: var(--closed); }
.badge.pre { background: var(--warn-bg); color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.actions a { color: var(--accent); font-weight: 600; font-size: 0.9rem; text-decoration: none; }
.actions a:hover { text-decoration: underline; }
button.toggle, button.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.9rem;
  font-weight: 600;
}
button.fav { display: inline-flex; align-items: center; gap: 6px; color: var(--heart); }
button.fav[aria-pressed="true"] { background: var(--heart-bg); border-color: var(--heart); }
button.fav .heart { font-size: 1.05rem; line-height: 1; }
button.danger { color: var(--warn); }
button.danger.arm { background: var(--warn-bg); border-color: var(--warn); }
.abstract { font-size: 0.95rem; line-height: 1.6; max-width: 65ch; border-top: 1px solid var(--line); padding-top: 10px; overflow-wrap: anywhere; }
.abstract.none { color: var(--muted); font-style: italic; }

.colpanel { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.colpanel label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; padding: 4px 0; min-width: 0; overflow-wrap: anywhere; }
.colpanel input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.colpanel .newrow { padding: 4px 0 0; }

.libhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.libhead .count { color: var(--muted); font-size: 0.9rem; }
.manage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.manage input[type="text"] { padding: 6px 10px; font-size: 0.95rem; min-width: 12ch; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); font-size: 0.95rem; }
input[type="file"] { display: none; }

button.more { align-self: center; background: var(--surface); color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 11px 22px; font-weight: 600; }
button.more[disabled] { opacity: 0.6; cursor: default; }
footer { color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color 0.15s; } .card:hover { border-color: var(--accent); } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button type="button" class="menubtn" id="menuBtn" aria-label="Menü öffnen" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    <span class="brand">JournalBing</span>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="Hauptmenü">
    <h1 class="brand">JournalBing</h1>
    <nav id="sideNav" aria-label="Funktionen"></nav>
    <div class="sidestatus" id="libStatus" role="status" aria-live="polite"></div>
    <input type="file" id="importFile" accept=".json,application/json">
  </aside>

  <main class="main">
    <div class="content">
      <div class="error" id="notice" role="alert" hidden></div>

      <section class="view" id="viewSearch">
        <div>
          <h2>Suche</h2>
          <p class="sub">Aktuelle Paper zu deinem Thema, mit Open-Access-Status, Zitationen und Abstract.</p>
        </div>
        <form class="search" id="form" autocomplete="off">
          <div class="row">
            <input type="search" id="q" placeholder="Thema, z. B. cellular senescence" aria-label="Suchbegriff" enterkeyhint="search">
            <button class="primary" type="submit">Suchen</button>
          </div>
          <div class="filters">
            <label><input type="checkbox" id="oa" checked> Nur Open Access</label>
            <label><input type="checkbox" id="pre"> Preprints einbeziehen</label>
            <label>Zeitraum
              <select id="period">
                <option value="0">Alle</option>
                <option value="1">Letztes Jahr</option>
                <option value="3" selected>Letzte 3 Jahre</option>
                <option value="5">Letzte 5 Jahre</option>
              </select>
            </label>
            <label>Sortierung
              <select id="sort">
                <option value="publication_date:desc" selected>Neueste zuerst</option>
                <option value="cited_by_count:desc">Meistzitiert</option>
                <option value="relevance_score:desc">Beste Treffer</option>
              </select>
            </label>
          </div>
        </form>

        <div class="examples" id="examples">
          <span>Zum Ausprobieren:</span>
        </div>

        <div class="status" id="status" role="status" aria-live="polite"></div>
        <ol class="results" id="results"></ol>
        <button class="more" id="more" type="button" hidden>Mehr laden</button>
      </section>

      <section class="view" id="viewLib" hidden>
        <div class="libhead">
          <div>
            <h2 id="libTitle"></h2>
            <div class="count" id="libCount"></div>
          </div>
          <div class="manage" id="libManage"></div>
        </div>
        <ol class="results" id="libList"></ol>
      </section>

      <footer>Daten: OpenAlex (api.openalex.org). Zitationszahlen und Open-Access-Status können von anderen Datenbanken abweichen.</footer>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var API = "https://api.openalex.org/works";
  var PER_PAGE = 20;
  var SELECT = [
    "id", "doi", "title", "display_name", "type", "publication_date", "publication_year",
    "cited_by_count", "open_access", "authorships", "primary_location", "best_oa_location",
    "abstract_inverted_index"
  ].join(",");
  var STORE_KEY = "journalbing.v1";
  var FAV = "fav";

  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), qEl = $("q"), oaEl = $("oa"), preEl = $("pre");
  var periodEl = $("period"), sortEl = $("sort");
  var statusEl = $("status"), resultsEl = $("results"), moreEl = $("more"), examplesEl = $("examples");
  var viewSearch = $("viewSearch"), viewLib = $("viewLib");
  var noticeEl = $("notice");
  var libTitle = $("libTitle"), libCount = $("libCount"), libManage = $("libManage"), libList = $("libList");
  var libStatus = $("libStatus"), sideNav = $("sideNav");
  var sidebar = $("sidebar"), backdrop = $("backdrop"), menuBtn = $("menuBtn");

  var state = { page: 1, total: 0, shown: 0, loading: false, query: "" };
  var currentColId = FAV;
  var currentView = "search";
  var creating = false;
  var creatingValue = "";

  // ---------- Hilfsfunktionen ----------

  function rebuildAbstract(index) {
    if (!index) return "";
    var words = [];
    Object.keys(index).forEach(function (word) {
      index[word].forEach(function (pos) { words[pos] = word; });
    });
    return words.filter(function (w) { return w !== undefined; }).join(" ");
  }

  function dateYearsBack(years) {
    var d = new Date();
    d.setFullYear(d.getFullYear() - years);
    return d.toISOString().slice(0, 10);
  }

  function citationsPerYear(rec) {
    var pub = rec.date ? new Date(rec.date) : null;
    if (!pub || isNaN(pub.getTime())) return null;
    var years = (new Date() - pub) / (365.25 * 24 * 3600 * 1000);
    return (rec.cited || 0) / Math.max(years, 1);
  }

  function formatDate(iso) {
    if (!iso) return "";
    var p = iso.split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso;
  }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function newId() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  // OpenAlex-Eintrag in einen schlanken Datensatz umwandeln, der sich speichern laesst
  function normalize(work) {
    var oa = work.open_access || {};
    var best = work.best_oa_location || {};
    var prim = work.primary_location || {};
    var list = work.authorships || [];
    var name = function (a) { return (a && a.author && a.author.display_name) || "Unbekannt"; };
    return {
      id: work.id,
      title: work.display_name || work.title || "(ohne Titel)",
      doi: work.doi || null,
      landing: best.landing_page_url || prim.landing_page_url || work.doi || work.id,
      pdf: best.pdf_url || null,
      journal: (prim.source && prim.source.display_name) || "",
      date: work.publication_date || "",
      type: work.type || "",
      isOa: !!oa.is_oa,
      cited: work.cited_by_count || 0,
      authors: {
        first: list.length ? name(list[0]) : "",
        last: list.length > 1 ? name(list[list.length - 1]) : "",
        count: list.length
      },
      abstract: rebuildAbstract(work.abstract_inverted_index)
    };
  }

  // ---------- Speicher (Favoriten und Sammlungen) ----------

  function ensureFav(s) {
    var has = s.collections.some(function (c) { return c.id === FAV; });
    if (!has) s.collections.unshift({ id: FAV, name: "Favoriten", items: [] });
  }

  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.collections) && s.papers && typeof s.papers === "object") {
          ensureFav(s);
          return s;
        }
      }
    } catch (e) { /* leerer Start */ }
    var fresh = { collections: [], papers: {} };
    ensureFav(fresh);
    return fresh;
  }

  var store = loadStore();

  function showNotice(msg) {
    noticeEl.textContent = msg || "";
    noticeEl.hidden = !msg;
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
      showNotice("");
    } catch (e) {
      showNotice("Speichern im Browser ist nicht möglich (z. B. im privaten Modus). Deine Änderungen gehen beim Schließen der Seite verloren. Nutze den Export, um sie zu sichern.");
    }
  }

  function colById(id) {
    for (var i = 0; i < store.collections.length; i++) if (store.collections[i].id === id) return store.collections[i];
    return null;
  }

  function inCol(col, paperId) { return !!col && col.items.indexOf(paperId) !== -1; }

  function gc() {
    var used = {};
    store.collections.forEach(function (c) { c.items.forEach(function (id) { used[id] = true; }); });
    Object.keys(store.papers).forEach(function (id) { if (!used[id]) delete store.papers[id]; });
  }

  function setMember(colId, rec, on) {
    var c = colById(colId);
    if (!c) return;
    var i = c.items.indexOf(rec.id);
    if (on && i === -1) {
      c.items.unshift(rec.id);
      store.papers[rec.id] = rec;
    } else if (!on && i !== -1) {
      c.items.splice(i, 1);
      gc();
    }
    persist();
  }

  function createCollection(name) {
    name = (name || "").trim().slice(0, 60);
    if (!name) return null;
    var lower = name.toLowerCase();
    for (var i = 0; i < store.collections.length; i++) {
      if (store.collections[i].name.toLowerCase() === lower) return store.collections[i];
    }
    var c = { id: newId(), name: name, items: [] };
    store.collections.push(c);
    persist();
    return c;
  }

  // ---------- Seitenleiste ----------

  function openDrawer() {
    sidebar.classList.add("open");
    backdrop.hidden = false;
    menuBtn.setAttribute("aria-expanded", "true");
  }

  function closeDrawer() {
    sidebar.classList.remove("open");
    backdrop.hidden = true;
    menuBtn.setAttribute("aria-expanded", "false");
  }

  function navItem(label, count, active, onClick, extraClass) {
    var b = el("button", "navitem" + (active ? " active" : "") + (extraClass ? " " + extraClass : ""));
    b.type = "button";
    if (active) b.setAttribute("aria-current", "page");
    b.appendChild(el("span", "t", label));
    if (count !== null && count !== undefined) b.appendChild(el("span", "n", String(count)));
    b.addEventListener("click", onClick);
    return b;
  }

  function renderSidebar() {
    sideNav.innerHTML = "";

    sideNav.appendChild(navItem("Suche", null, currentView === "search", function () { showView("search"); }));

    sideNav.appendChild(el("div", "sidelabel", "Sammlungen"));
    store.collections.forEach(function (c) {
      var label = c.id === FAV ? "♥ " + c.name : c.name;
      var active = currentView === "lib" && currentColId === c.id;
      sideNav.appendChild(navItem(label, c.items.length, active, function () {
        currentColId = c.id;
        showView("lib");
      }));
    });

    if (creating) {
      var row = el("div", "newrow");
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Name";
      input.maxLength = 60;
      input.value = creatingValue;
      input.setAttribute("aria-label", "Name der neuen Sammlung");
      var ok = el("button", "toggle", "OK");
      ok.type = "button";
      function submit() {
        var c = createCollection(input.value);
        creating = false;
        creatingValue = "";
        if (c) { currentColId = c.id; showView("lib"); }
        else renderSidebar();
      }
      input.addEventListener("input", function () { creatingValue = input.value; });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); submit(); }
        if (e.key === "Escape") { creating = false; creatingValue = ""; renderSidebar(); }
      });
      ok.addEventListener("click", submit);
      row.appendChild(input);
      row.appendChild(ok);
      sideNav.appendChild(row);
      setTimeout(function () { input.focus(); }, 0);
    } else {
      sideNav.appendChild(navItem("+ Neue Sammlung", null, false, function () {
        creating = true;
        renderSidebar();
      }, "quiet"));
    }

    sideNav.appendChild(el("div", "sidelabel", "Daten"));
    sideNav.appendChild(navItem("Sammlungen exportieren", null, false, exportData, "quiet"));
    sideNav.appendChild(navItem("Sammlungen importieren", null, false, function () { $("importFile").click(); }, "quiet"));
    sideNav.appendChild(el("div", "sidehint", "Gespeichert wird nur in diesem Browser. Mit Export und Import ziehst du auf ein anderes Gerät um."));
  }

  function showView(name) {
    currentView = name;
    var lib = name === "lib";
    viewSearch.hidden = lib;
    viewLib.hidden = !lib;
    libStatus.textContent = "";
    if (lib) renderLibrary();
    renderSidebar();
    closeDrawer();
    window.scrollTo(0, 0);
  }

  // ---------- Ergebniskarte ----------

  function authorsLine(rec) {
    var box = el("div", "authors");
    var a = rec.authors || {};
    if (!a.first) { box.textContent = "Keine Autorenangabe"; return box; }
    box.appendChild(el("b", null, a.first));
    if (a.last) {
      box.appendChild(document.createTextNode(" (Erstautor) · "));
      box.appendChild(el("b", null, a.last));
      box.appendChild(document.createTextNode(" (Letztautor)"));
      if (a.count > 2) box.appendChild(document.createTextNode(" · +" + (a.count - 2) + " weitere"));
    }
    return box;
  }

  function externalLink(text, url) {
    var a = el("a", null, text);
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }

  // ctx: "search" oder "library"
  function renderCard(rec, ctx) {
    var li = el("li", "card");
    var landing = safeUrl(rec.landing);

    var h = el("h2");
    if (landing) h.appendChild(externalLink(rec.title, landing));
    else h.textContent = rec.title;
    li.appendChild(h);

    li.appendChild(authorsLine(rec));

    var meta = el("div", "meta");
    if (rec.journal) meta.appendChild(el("span", null, rec.journal));
    if (rec.date) meta.appendChild(el("span", null, formatDate(rec.date)));
    if (rec.type === "preprint") meta.appendChild(el("span", "badge pre", "Preprint"));
    meta.appendChild(el("span", rec.isOa ? "badge oa" : "badge closed", rec.isOa ? "Open Access" : "Kein freier Zugang"));
    var cit = el("span");
    cit.appendChild(el("span", "num", String(rec.cited || 0)));
    cit.appendChild(document.createTextNode(" Zitationen"));
    var cpy = citationsPerYear(rec);
    if (cpy !== null) cit.appendChild(document.createTextNode(" (" + cpy.toFixed(1).replace(".", ",") + " pro Jahr)"));
    meta.appendChild(cit);
    li.appendChild(meta);

    var actions = el("div", "actions");

    var favBtn = el("button", "toggle fav");
    favBtn.type = "button";
    var heart = el("span", "heart");
    heart.setAttribute("aria-hidden", "true");
    var favLabel = el("span");
    favBtn.appendChild(heart);
    favBtn.appendChild(favLabel);
    actions.appendChild(favBtn);

    var colBtn = el("button", "toggle", "Sammlung");
    colBtn.type = "button";
    colBtn.setAttribute("aria-expanded", "false");
    actions.appendChild(colBtn);

    var absBtn = el("button", "toggle", "Abstract anzeigen");
    absBtn.type = "button";
    absBtn.setAttribute("aria-expanded", "false");
    actions.appendChild(absBtn);

    var pdf = safeUrl(rec.pdf);
    if (pdf) actions.appendChild(externalLink("PDF", pdf));
    var doi = safeUrl(rec.doi);
    if (doi) actions.appendChild(externalLink("DOI", doi));
    li.appendChild(actions);

    var abs = el("div", "abstract");
    abs.hidden = true;
    if (rec.abstract) abs.textContent = rec.abstract;
    else {
      abs.className = "abstract none";
      abs.textContent = "Für dieses Paper ist in OpenAlex kein Abstract hinterlegt. Der Link zur Originalseite zeigt ihn meist trotzdem.";
    }
    li.appendChild(abs);

    var panel = el("div", "colpanel");
    panel.hidden = true;
    li.appendChild(panel);

    function updateFav() {
      var on = inCol(colById(FAV), rec.id);
      favBtn.setAttribute("aria-pressed", on ? "true" : "false");
      heart.textContent = on ? "♥" : "♡";
      favLabel.textContent = on ? "Favorit" : "Favorisieren";
    }

    function afterChange() {
      updateFav();
      renderSidebar();
      if (!panel.hidden) buildPanel();
      if (ctx === "library") {
        if (!inCol(colById(currentColId), rec.id)) renderLibrary();
        else renderLibraryHead();
      }
    }

    function buildPanel() {
      panel.innerHTML = "";
      store.collections.forEach(function (c) {
        var label = el("label");
        var box = document.createElement("input");
        box.type = "checkbox";
        box.checked = inCol(c, rec.id);
        box.addEventListener("change", function () {
          setMember(c.id, rec, box.checked);
          afterChange();
        });
        label.appendChild(box);
        label.appendChild(el("span", null, c.name));
        panel.appendChild(label);
      });
      var row = el("div", "newrow");
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Neue Sammlung";
      input.maxLength = 60;
      input.setAttribute("aria-label", "Name der neuen Sammlung");
      var add = el("button", "toggle", "Anlegen");
      add.type = "button";
      add.addEventListener("click", function () {
        var c = createCollection(input.value);
        if (!c) return;
        setMember(c.id, rec, true);
        afterChange();
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); add.click(); }
      });
      row.appendChild(input);
      row.appendChild(add);
      panel.appendChild(row);
    }

    favBtn.addEventListener("click", function () {
      setMember(FAV, rec, favBtn.getAttribute("aria-pressed") !== "true");
      afterChange();
    });
    colBtn.addEventListener("click", function () {
      var open = panel.hidden;
      panel.hidden = !open;
      colBtn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) buildPanel();
    });
    absBtn.addEventListener("click", function () {
      var open = abs.hidden;
      abs.hidden = !open;
      absBtn.textContent = open ? "Abstract ausblenden" : "Abstract anzeigen";
      absBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });

    updateFav();
    return li;
  }

  // ---------- Suche ----------

  function buildUrl(page) {
    var filters = [];
    filters.push("type:" + (preEl.checked ? "article|review|preprint" : "article|review"));
    if (oaEl.checked) filters.push("is_oa:true");
    var years = parseInt(periodEl.value, 10);
    if (years > 0) filters.push("from_publication_date:" + dateYearsBack(years));
    return API + "?" + [
      "search=" + encodeURIComponent(state.query),
      "filter=" + filters.join(","),
      "sort=" + sortEl.value,
      "per-page=" + PER_PAGE,
      "page=" + page,
      "select=" + SELECT
    ].join("&");
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  function showError(msg) {
    resultsEl.innerHTML = "";
    var li = document.createElement("li");
    li.appendChild(el("div", "error", msg));
    resultsEl.appendChild(li);
  }

  function load(page, append) {
    if (state.loading) return;
    state.loading = true;
    moreEl.disabled = true;
    setStatus("Suche läuft …");

    fetch(buildUrl(page))
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var works = data.results || [];
        if (!append) { resultsEl.innerHTML = ""; state.shown = 0; }
        state.total = (data.meta && data.meta.count) || 0;
        works.forEach(function (w) { resultsEl.appendChild(renderCard(normalize(w), "search")); });
        state.shown += works.length;
        state.page = page;

        if (!state.total) setStatus("Keine Treffer. Versuch einen allgemeineren Begriff oder lockere die Filter.");
        else setStatus(state.shown + " von " + state.total.toLocaleString("de-DE") + " Treffern angezeigt");
        moreEl.hidden = state.shown >= state.total || works.length === 0;
      })
      .catch(function (err) {
        if (!append) showError("Die Suche hat nicht geklappt (" + err.message + "). Prüfe deine Internetverbindung und versuch es noch einmal.");
        else setStatus("Weitere Treffer konnten nicht geladen werden. Versuch es noch einmal.");
      })
      .then(function () {
        state.loading = false;
        moreEl.disabled = false;
      });
  }

  function startSearch() {
    var q = qEl.value.trim();
    if (!q) { setStatus("Gib zuerst ein Thema ein."); return; }
    state.query = q;
    moreEl.hidden = true;
    load(1, false);
  }

  // ---------- Sammlungen-Ansicht ----------

  function renderLibraryHead() {
    var cur = colById(currentColId) || store.collections[0];
    libTitle.textContent = cur.id === FAV ? "♥ " + cur.name : cur.name;
    libCount.textContent = cur.items.length === 1 ? "1 Paper" : cur.items.length + " Paper";
  }

  function renderManage(cur) {
    libManage.innerHTML = "";
    if (cur.id === FAV) return;

    var renameBtn = el("button", "ghost", "Umbenennen");
    renameBtn.type = "button";
    renameBtn.addEventListener("click", function () {
      libManage.innerHTML = "";
      var input = document.createElement("input");
      input.type = "text";
      input.value = cur.name;
      input.maxLength = 60;
      input.setAttribute("aria-label", "Neuer Name");
      var ok = el("button", "ghost", "Speichern");
      ok.type = "button";
      var cancel = el("button", "ghost", "Abbrechen");
      cancel.type = "button";
      ok.addEventListener("click", function () {
        var n = input.value.trim().slice(0, 60);
        if (n) { cur.name = n; persist(); }
        renderLibrary();
        renderSidebar();
      });
      cancel.addEventListener("click", function () { renderLibrary(); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); ok.click(); }
      });
      libManage.appendChild(input);
      libManage.appendChild(ok);
      libManage.appendChild(cancel);
      input.focus();
    });

    var delBtn = el("button", "ghost danger", "Löschen");
    delBtn.type = "button";
    var timer = null;
    delBtn.addEventListener("click", function () {
      if (!delBtn.classList.contains("arm")) {
        delBtn.classList.add("arm");
        delBtn.textContent = "Wirklich löschen?";
        timer = setTimeout(function () {
          delBtn.classList.remove("arm");
          delBtn.textContent = "Löschen";
        }, 4000);
        return;
      }
      clearTimeout(timer);
      store.collections = store.collections.filter(function (c) { return c.id !== cur.id; });
      gc();
      persist();
      currentColId = FAV;
      renderLibrary();
      renderSidebar();
    });

    libManage.appendChild(renameBtn);
    libManage.appendChild(delBtn);
  }

  function renderLibrary() {
    if (!colById(currentColId)) currentColId = FAV;
    var cur = colById(currentColId);

    renderLibraryHead();
    renderManage(cur);

    libList.innerHTML = "";
    var shown = 0;
    cur.items.forEach(function (id) {
      var rec = store.papers[id];
      if (rec) { libList.appendChild(renderCard(rec, "library")); shown++; }
    });
    if (!shown) {
      var li = document.createElement("li");
      li.appendChild(el("div", "empty", cur.id === FAV
        ? "Noch keine Favoriten. Tippe bei einem Paper auf das Herz, dann erscheint es hier."
        : "Diese Sammlung ist noch leer. Bei jedem Paper kannst du über „Sammlung“ festlegen, wo es hinein soll."));
      libList.appendChild(li);
    }
  }

  // ---------- Export und Import ----------

  function exportData() {
    try {
      var payload = JSON.stringify({ app: "journalbing", version: 1, collections: store.collections, papers: store.papers }, null, 2);
      var blob = new Blob([payload], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "journalbing-sammlungen.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      libStatus.textContent = "Export gestartet. Die Datei landet in deinen Downloads.";
    } catch (e) {
      libStatus.textContent = "Der Export hat nicht geklappt.";
    }
  }

  function importData(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { libStatus.textContent = "Die Datei ist keine gültige JournalBing-Datei."; return; }
    if (!data || !Array.isArray(data.collections) || !data.papers || typeof data.papers !== "object") {
      libStatus.textContent = "Die Datei ist keine gültige JournalBing-Datei.";
      return;
    }
    var before = Object.keys(store.papers).length;
    data.collections.forEach(function (ic) {
      if (!ic || typeof ic.name !== "string" || !Array.isArray(ic.items)) return;
      var target = ic.id === FAV ? colById(FAV) : null;
      if (!target) {
        var lower = ic.name.toLowerCase();
        for (var i = 0; i < store.collections.length; i++) {
          if (store.collections[i].id !== FAV && store.collections[i].name.toLowerCase() === lower) { target = store.collections[i]; break; }
        }
      }
      if (!target) {
        target = { id: newId(), name: ic.name.slice(0, 60), items: [] };
        store.collections.push(target);
      }
      ic.items.forEach(function (pid) {
        var rec = data.papers[pid];
        if (typeof pid !== "string" || !rec || typeof rec.title !== "string") return;
        if (!store.papers[pid]) {
          store.papers[pid] = {
            id: pid,
            title: String(rec.title),
            doi: safeUrl(rec.doi),
            landing: safeUrl(rec.landing),
            pdf: safeUrl(rec.pdf),
            journal: String(rec.journal || ""),
            date: String(rec.date || ""),
            type: String(rec.type || ""),
            isOa: !!rec.isOa,
            cited: Number(rec.cited) || 0,
            authors: {
              first: String((rec.authors && rec.authors.first) || ""),
              last: String((rec.authors && rec.authors.last) || ""),
              count: Number(rec.authors && rec.authors.count) || 0
            },
            abstract: String(rec.abstract || "")
          };
        }
        if (target.items.indexOf(pid) === -1) target.items.push(pid);
      });
    });
    persist();
    if (currentView === "lib") renderLibrary();
    renderSidebar();
    var added = Object.keys(store.papers).length - before;
    libStatus.textContent = "Import fertig. " + added + (added === 1 ? " neues Paper" : " neue Paper") + " hinzugefügt.";
  }

  // ---------- Ereignisse ----------

  form.addEventListener("submit", function (e) { e.preventDefault(); startSearch(); });
  moreEl.addEventListener("click", function () { load(state.page + 1, true); });
  [oaEl, preEl, periodEl, sortEl].forEach(function (c) {
    c.addEventListener("change", function () { if (state.query) startSearch(); });
  });

  menuBtn.addEventListener("click", function () {
    if (sidebar.classList.contains("open")) closeDrawer(); else openDrawer();
  });
  backdrop.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  $("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { importData(String(reader.result)); };
    reader.onerror = function () { libStatus.textContent = "Die Datei konnte nicht gelesen werden."; };
    reader.readAsText(f);
    e.target.value = "";
  });

  ["cellular senescence", "channelrhodopsin", "autophagy aging", "mitochondrial dynamics"].forEach(function (t) {
    var b = el("button", "chip", t);
    b.type = "button";
    b.addEventListener("click", function () { qEl.value = t; startSearch(); });
    examplesEl.appendChild(b);
  });

  renderSidebar();
})();
</script>
</body>
</html>
